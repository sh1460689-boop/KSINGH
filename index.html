<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSingh App Prototype</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
        }
        .header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 3px;
        }
        .battery {
            font-size: 18px;
            margin-bottom: 12px;
        }
        .nav-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .nav-buttons button {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .message {
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="header">9:41</div>
    <div class="battery">92%</div>

    <div class="nav-buttons">
        <button>Home</button>
        <button>Search</button>
        <button>Create</button>
        <button>Reels</button>
        <button>Library</button>
    </div>

    <div class="message">Action performed successfully!</div>

</body>
</html>
