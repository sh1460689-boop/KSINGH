<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSingh App Prototype</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f19;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }
        /* Neon glowing effects */
        .neon-border {
            border: 1px solid transparent;
            border-image: linear-gradient(to right, #3b82f6, #8b5cf6, #ec4899) 1;
        }
        .neon-glow {
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
        }
        .gradient-text {
            background: linear-gradient(135deg, #60a5fa 0%, #c084fc 50%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gradient-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen bg-gray-950">

    <!-- Mobile Frame Container (Simulating App Experience) -->
    <div id="app-container" class="relative w-full max-w-md h-[100vh] sm:h-[844px] bg-[#0b0f19] text-white flex flex-col overflow-hidden sm:rounded-[40px] sm:shadow-2xl sm:border-4 sm:border-gray-800">

        <!-- Top Status Bar (Mobile Header Simulator) -->
        <div class="flex justify-between items-center px-6 py-3 text-xs font-semibold text-gray-400 bg-[#0b0f19] z-50 select-none">
            <span id="current-time">9:41</span>
            <div class="flex items-center space-x-2 text-white">
                <i class="fa-solid fa-signal text-[10px]"></i>
                <i class="fa-solid fa-wifi text-[10px]"></i>
                <div class="flex items-center text-[10px] bg-gray-800 px-1 rounded">92%</div>
            </div>
        </div>

        <!-- MAIN VIEW CONTAINER -->
        <div id="view-container" class="flex-1 overflow-y-auto relative pb-20">
            <!-- Dynamic Screens will be loaded here -->
        </div>

        <!-- FLOATING BOTTOM NAVIGATION BAR -->
        <nav id="bottom-nav" class="absolute bottom-0 left-0 right-0 bg-[#0f1423]/95 backdrop-blur-md border-t border-gray-800/80 px-4 py-2 flex justify-around items-center z-45 transition-transform duration-300">
            <button onclick="switchScreen('home')" class="nav-btn flex flex-col items-center text-blue-400" data-target="home">
                <i class="fa-solid fa-house text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Home</span>
            </button>
            <button onclick="switchScreen('search')" class="nav-btn flex flex-col items-center text-gray-400 hover:text-white" data-target="search">
                <i class="fa-solid fa-magnifying-glass text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Search</span>
            </button>
            <button onclick="switchScreen('create')" class="nav-btn flex flex-col items-center text-gray-400 hover:text-white" data-target="create">
                <div class="w-10 h-10 rounded-full gradient-btn flex items-center justify-center text-white shadow-lg -mt-3 border-2 border-[#0b0f19]">
                    <i class="fa-solid fa-plus text-base"></i>
                </div>
                <span class="text-[10px] font-medium mt-0.5">Create</span>
            </button>
            <button onclick="switchScreen('reels')" class="nav-btn flex flex-col items-center text-gray-400 hover:text-white" data-target="reels">
                <i class="fa-solid fa-clapperboard text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Reels</span>
            </button>
            <button onclick="switchScreen('library')" class="nav-btn flex flex-col items-center text-gray-400 hover:text-white" data-target="library">
                <i class="fa-solid fa-folder-open text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Library</span>
            </button>
        </nav>

        <!-- MODALS & TOAST NOTIFICATIONS -->
        <div id="toast" class="absolute top-16 left-1/2 transform -translate-x-1/2 bg-gray-900/95 text-white px-4 py-2 rounded-full text-xs font-medium border border-gray-700 shadow-xl z-50 hidden transition-all duration-300">
            Action performed successfully!
        </div>

    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // --- State Management ---
        let currentScreen = 'splash';
        let activeCategory = 'All';

        // Sample Data for Videos
        const videos = [
            {
                id: 1,
                title: "19 Crash Course Butter Chicken Recipe",
                channel: "Cooking Hack",
                views: "1.8M views",
                time: "3 days ago",
                thumbnail: "https://images.unsplash.com/photo-1588166524941-3bf61a9c41db?w=600&auto=format&fit=crop&q=80",
                avatar: "https://images.unsplash.com/photo-1577219491135-ce391730fb2c?w=100&auto=format&fit=crop&q=80",
                duration: "25:43",
                category: "Cooking",
                likes: "52K"
            },
            {
                id: 2,
                title: "19 Crash Course — All New Features Explained",
                channel: "Dev Studio",
                views: "1.1M views",
                time: "1 week ago",
                thumbnail: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=600&auto=format&fit=crop&q=80",
                avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&auto=format&fit=crop&q=80",
                duration: "14:20",
                category: "Programming",
                likes: "89K"
            },
            {
                id: 3,
                title: "Solo Travel to Himachal | Complete Mountain Guide",
                channel: "KSingh Travel",
                views: "967K views",
                time: "5 days ago",
                thumbnail: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600&auto=format&fit=crop&q=80",
                avatar: "https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=100&auto=format&fit=crop&q=80",
                duration: "18:10",
                category: "Music",
                likes: "45K"
            },
            {
                id: 4,
                title: "Crispy Air Fryer Butter Chicken in 15 Mins",
                channel: "KSingh Cooking",
                views: "482K views",
                time: "2 days ago",
                thumbnail: "https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?w=600&auto=format&fit=crop&q=80",
                avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80",
                duration: "14:32",
                category: "Cooking",
                likes: "34K"
            },
            {
                id: 5,
                title: "Pro Gaming Setup Tour & RGB Lighting Guide",
                channel: "Gaming Nexus",
                views: "340K views",
                time: "4 days ago",
                thumbnail: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=600&auto=format&fit=crop&q=80",
                avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&auto=format&fit=crop&q=80",
                duration: "12:05",
                category: "Gaming",
                likes: "28K"
            }
        ];

        // Initialize App on Load
        window.onload = function() {
            // Update time clock
            updateTime();
            setInterval(updateTime, 60000);
            
            // Start with Splash Screen 1 (Logo Intro)
            renderScreen('splash');
        };

        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('current-time').innerText = `${hours}:${minutes}`;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 2500);
        }

        // --- Screen Router ---
        function switchScreen(screenName, param = null) {
            currentScreen = screenName;
            const bottomNav = document.getElementById('bottom-nav');
            
            // Hide bottom nav on onboarding/auth screens & video player
            if (['splash', 'welcome', 'auth', 'player'].includes(screenName)) {
                bottomNav.classList.add('translate-y-full', 'opacity-0');
            } else {
                bottomNav.classList.remove('translate-y-full', 'opacity-0');
                updateActiveNavButton(screenName);
            }

            renderScreen(screenName, param);
        }

        function updateActiveNavButton(name) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const target = btn.getAttribute('data-target');
                if (target === name) {
                    btn.classList.add('text-blue-400');
                    btn.classList.remove('text-gray-400');
                } else {
                    btn.classList.remove('text-blue-400');
                    btn.classList.add('text-gray-400');
                }
            });
        }

        function renderScreen(name, param) {
            const container = document.getElementById('view-container');
            container.innerHTML = '';

            switch(name) {
                case 'splash':
                    container.innerHTML = getSplashHTML();
                    break;
                case 'welcome':
                    container.innerHTML = getWelcomeHTML();
                    break;
                case 'auth':
                    container.innerHTML = getAuthHTML();
                    break;
                case 'home':
                    container.innerHTML = getHomeHTML();
                    break;
                case 'search':
                    container.innerHTML = getSearchHTML();
                    break;
                case 'player':
                    container.innerHTML = getPlayerHTML(param);
                    break;
                case 'channel':
                    container.innerHTML = getChannelHTML();
                    break;
                case 'reels':
                    container.innerHTML = getReelsHTML();
                    break;
                case 'library':
                    container.innerHTML = getLibraryHTML();
                    break;
                case 'create':
                    container.innerHTML = getCreateHTML();
                    break;
                case 'notifications':
                    container.innerHTML = getNotificationsHTML();
                    break;
                case 'profile':
                    container.innerHTML = getProfileHTML();
                    break;
                default:
                    container.innerHTML = getHomeHTML();
            }
            container.scrollTop = 0;
        }

        // --- SCREEN TEMPLATES ---

        function getSplashHTML() {
            return `
                <div class="flex flex-col items-center justify-center h-full px-6 text-center bg-black relative overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-t from-purple-900/30 via-transparent to-blue-900/30 pointer-events-none"></div>
                    <div class="relative z-10 space-y-6 animate-pulse">
                        <div class="w-48 h-48 mx-auto rounded-3xl p-1 bg-gradient-to-tr from-blue-500 via-purple-500 to-pink-500 shadow-2xl flex items-center justify-center neon-glow">
                            <div class="w-full h-full bg-gray-950 rounded-[22px] flex flex-col items-center justify-center p-4">
                                <span class="text-4xl font-extrabold tracking-wider gradient-text">KS</span>
                                <span class="text-sm font-bold tracking-widest text-amber-400 mt-2">KSINGH</span>
                            </div>
                        </div>
                        <h1 class="text-3xl font-bold tracking-tight text-white">KSINGH APP</h1>
                        <p class="text-gray-400 text-sm max-w-xs">Mix of Instagram, YouTube & Facebook in one power-packed platform.</p>
                    </div>
                    <div class="absolute bottom-10 left-6 right-6 z-10">
                        <button onclick="switchScreen('welcome')" class="w-full py-4 rounded-2xl gradient-btn text-white font-semibold text-lg shadow-lg hover:opacity-95 transition">
                            Get Started
                        </button>
                    </div>
                </div>
            `;
        }

        function getWelcomeHTML() {
            return `
                <div class="flex flex-col justify-between h-full px-6 py-10 bg-black relative">
                    <div class="flex justify-end">
                        <button onclick="switchScreen('home')" class="text-gray-400 text-sm font-medium hover:text-white">Skip</button>
                    </div>
                    <div class="flex flex-col items-center text-center space-y-4 my-auto">
                        <div class="w-36 h-36 rounded-2xl p-1 bg-gradient-to-tr from-blue-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg">
                            <div class="w-full h-full bg-gray-950 rounded-[14px] flex flex-col items-center justify-center p-2">
                                <span class="text-3xl font-black gradient-text">KS</span>
                                <span class="text-xs font-bold text-amber-400 mt-1">KSINGH</span>
                            </div>
                        </div>
                        <h2 class="text-2xl font-bold text-amber-400">KSINGH</h2>
                        <p class="text-gray-300 text-sm font-medium">Mix of Instagram, YouTube & Facebook</p>
                    </div>
                    <div class="space-y-3">
                        <button onclick="switchScreen('auth')" class="w-full py-4 rounded-full gradient-btn text-white font-semibold shadow-xl">
                            Get Started
                        </button>
                    </div>
                </div>
            `;
        }

        function getAuthHTML() {
            return `
                <div class="flex flex-col justify-between h-full px-6 py-10 bg-black">
                    <div class="text-center space-y-3 pt-6">
                        <div class="w-24 h-24 mx-auto rounded-2xl p-1 bg-gradient-to-tr from-blue-500 via-purple-500 to-pink-500 flex items-center justify-center">
                            <div class="w-full h-full bg-gray-950 rounded-[14px] flex flex-col items-center justify-center">
                                <span class="text-2xl font-black gradient-text">KS</span>
                            </div>
                        </div>
                        <h2 class="text-xl font-bold text-amber-400">Welcome to K SINGH</h2>
                        <p class="text-gray-400 text-xs">Connect. Share. Discover.</p>
                    </div>
                    <div class="space-y-4 my-auto">
                        <button onclick="switchScreen('home')" class="w-full py-3.5 px-4 rounded-full border border-gray-700 bg-gray-900/50 flex items-center justify-center space-x-3 text-sm font-medium hover:bg-gray-800 transition">
                            <i class="fa-brands fa-google text-red-500 text-lg"></i>
                            <span>Continue with Google</span>
                        </button>
                        <button onclick="switchScreen('home')" class="w-full py-3.5 px-4 rounded-full border border-gray-700 bg-gray-900/50 flex items-center justify-center space-x-3 text-sm font-medium hover:bg-gray-800 transition">
                            <i class="fa-solid fa-envelope text-blue-400 text-lg"></i>
                            <span>Continue with Email</span>
                        </button>
                        <button onclick="switchScreen('home')" class="w-full py-3.5 px-4 rounded-full border border-gray-700 bg-gray-900/50 flex items-center justify-center space-x-3 text-sm font-medium hover:bg-gray-800 transition">
                            <i class="fa-solid fa-phone text-pink-400 text-lg"></i>
                            <span>Continue with Phone Number</span>
                        </button>
                    </div>
                    <div class="text-center text-[10px] text-gray-500">
                        By continuing you agree to our <a href="#" class="underline text-gray-400">Terms of Service</a> • <a href="#" class="underline text-gray-400">Privacy Policy</a>
                    </div>
                </div>
            `;
        }

        function getHomeHTML() {
            const categories = ['All', 'Live', 'Cooking', 'Programming', 'Music', 'Gaming', 'News'];
            const filteredVideos = activeCategory === 'All' ? videos : videos.filter(v => v.category === activeCategory);

            return `
                <div class="flex flex-col pb-16">
                    <!-- App Header -->
                    <div class="sticky top-0 bg-[#0b0f19]/95 backdrop-blur-md z-30 px-4 py-3 flex items-center justify-between border-b border-gray-800/50">
                        <div class="flex items-center space-x-2 cursor-pointer" onclick="switchScreen('channel')">
                            <div class="w-9 h-9 rounded-full p-0.5 bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center">
                                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" class="w-full h-full rounded-full object-cover">
                            </div>
                            <span class="font-bold text-base tracking-tight text-white">KSingh App</span>
                        </div>
                        <div class="flex items-center space-x-4 text-gray-300">
                            <button onclick="switchScreen('search')"><i class="fa-solid fa-magnifying-glass text-lg"></i></button>
                            <button onclick="showToast('Casting to device...')"><i class="fa-solid fa-tv text-lg"></i></button>
                            <button onclick="switchScreen('notifications')"><i class="fa-solid fa-bell text-lg"></i></button>
                            <button onclick="switchScreen('profile')">
                                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&auto=format&fit=crop&q=80" class="w-7 h-7 rounded-full object-cover border border-purple-500">
                            </button>
                        </div>
                    </div>

                    <!-- Categories Bar -->
                    <div class="flex space-x-2 px-4 py-3 overflow-x-auto no-scrollbar bg-[#0b0f19]">
                        ${categories.map(cat => `
                            <button onclick="setActiveCategory('${cat}')" class="px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition ${activeCategory === cat ? 'bg-white text-black font-semibold' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'}">
                                ${cat === 'Live' ? '<span class="w-2 h-2 rounded-full bg-red-500 inline-block mr-1.5"></span>' : ''}
                                ${cat}
                            </button>
                        `).join('')}
                    </div>

                    <!-- Recommended Header -->
                    <div class="px-4 pt-3 pb-1">
                        <h3 class="text-sm font-bold text-gray-200">Recommended</h3>
                        <p class="text-[11px] text-gray-400">Based on your interests</p>
                    </div>

                    <!-- Feed Cards -->
                    <div class="space-y-6 px-4 pt-2">
                        ${filteredVideos.map(video => `
                            <div class="flex flex-col bg-gray-900/40 rounded-2xl overflow-hidden border border-gray-800/60 shadow-lg group">
                                <div class="relative cursor-pointer" onclick="switchScreen('player', ${video.id})">
                                    <img src="${video.thumbnail}" class="w-full h-52 object-cover group-hover:scale-[1.01] transition duration-300">
                                    <span class="absolute bottom-2 right-2 bg-black/80 text-[10px] px-2 py-0.5 rounded font-semibold text-white">${video.duration}</span>
                                </div>
                                <div class="p-3 flex items-start space-x-3">
                                    <img src="${video.avatar}" class="w-10 h-10 rounded-full object-cover mt-0.5 cursor-pointer" onclick="switchScreen('channel')">
                                    <div class="flex-1">
                                        <h4 class="text-sm font-semibold text-white leading-snug cursor-pointer line-clamp-2" onclick="switchScreen('player', ${video.id})">${video.title}</h4>
                                        <p class="text-xs text-gray-400 mt-1">${video.channel} • ${video.views} • ${video.time}</p>
                                    </div>
                                    <button onclick="showOptionMenu(event)" class="text-gray-400 hover:text-white p-1">
                                        <i class="fa-solid fa-ellipsis-vertical text-sm"></i>
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function setActiveCategory(cat) {
            activeCategory = cat;
            renderScreen('home');
        }

        function showOptionMenu(e) {
            e.stopPropagation();
            // Show interactive options modal popup
            const modalHTML = `
                <div id="options-modal" class="absolute inset-0 bg-black/70 z-50 flex items-end animate-fade-in" onclick="closeOptionMenu(event)">
                    <div class="w-full bg-[#121826] rounded-t-3xl p-4 space-y-3 border-t border-gray-800 max-h-[75vh] overflow-y-auto" onclick="event.stopPropagation()">
                        <div class="w-12 h-1 bg-gray-700 rounded-full mx-auto mb-2"></div>
                        <div class="space-y-1 text-sm">
                            <button onclick="closeOptionMenu(); showToast('Playing on connected device')" class="w-full flex items-center space-x-4 py-2.5 px-3 hover:bg-gray-800 rounded-xl text-gray-200">
                                <i class="fa-solid fa-tv text-blue-400 w-5"></i> <span>Play on different device</span>
                            </button>
                            <button onclick="closeOptionMenu(); showToast('Added to queue')" class="w-full flex items-center space-x-4 py-2.5 px-3 hover:bg-gray-800 rounded-xl text-gray-200">
                                <i class="fa-solid fa-list text-purple-400 w-5"></i> <span>Play next in queue</span>
                            </button>
                            <button onclick="closeOptionMenu(); showToast('Saved to Watch Later')" class="w-full flex items-center space-x-4 py-2.5 px-3 hover:bg-gray-800 rounded-xl text-gray-200">
                                <i class="fa-solid fa-clock text-amber-400 w-5"></i> <span>Save to Watch later</span>
                            </button>
                            <button onclick="closeOptionMenu(); showToast('Saved to playlist')" class="w-full flex items-center space-x-4 py-2.5 px-3 hover:bg-gray-800 rounded-xl text-gray-200">
                                <i class="fa-solid fa-bookmark text-pink-400 w-5"></i> <span>Save to playlist</span>
                            </button>
                            <button onclick="closeOptionMenu(); showToast('Downloading video...')" class="w-full flex items-center space-x-4 py-2.5 px-3 hover:bg-gray-800 rounded-xl text-gray-200">
                                <i class="fa-solid fa-download text-green-400 w-5"></i> <span>Download</span>
                            </button>
                            <button onclick="closeOptionMenu(); showToast('Share link copied')" class="w-full flex items-center space-x-4 py-2.5 px-3 hover:bg-gray-800 rounded-xl text-gray-200">
                                <i class="fa-solid fa-share-nodes text-blue-300 w-5"></i> <span>Share</span>
                            </button>
                            <button onclick="closeOptionMenu(); showToast('Marked as not interested')" class="w-full flex items-center space-x-4 py-2.5 px-3 hover:bg-gray-800 rounded-xl text-gray-200">
                                <i class="fa-solid fa-ban text-red-400 w-5"></i> <span>Not interested</span>
                            </button>
                            <button onclick="closeOptionMenu(); showToast('Channel removed from recommendations')" class="w-full flex items-center space-x-4 py-2.5 px-3 hover:bg-gray-800 rounded-xl text-gray-200">
                                <i class="fa-solid fa-user-slash text-orange-400 w-5"></i> <span>Don't recommend channel</span>
                            </button>
                            <button onclick="closeOptionMenu(); showToast('Report submitted')" class="w-full flex items-center space-x-4 py-2.5 px-3 hover:bg-gray-800 rounded-xl text-red-400">
                                <i class="fa-solid fa-flag text-red-400 w-5"></i> <span>Report</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHTML);
        }

        function closeOptionMenu() {
            const modal = document.getElementById('options-modal');
            if (modal) modal.remove();
        }

        function getSearchHTML() {
            const searchTags = ['Butter Chicken', 'Naan', 'Biryani', 'Desserts', 'React JS', 'Gaming'];
            return `
                <div class="flex flex-col p-4 space-y-4">
                    <div class="flex items-center space-x-3">
                        <button onclick="switchScreen('home')" class="text-gray-300"><i class="fa-solid fa-arrow-left text-lg"></i></button>
                        <div class="flex-1 flex items-center bg-gray-900 border border-gray-700 rounded-full px-4 py-2">
                            <input type="text" placeholder="Search recipes, tutorials..." class="bg-transparent text-sm w-full outline-none text-white placeholder-gray-500">
                            <i class="fa-solid fa-microphone text-gray-400 mr-2"></i>
                            <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
                        </div>
                    </div>
                    <div class="flex space-x-2 overflow-x-auto no-scrollbar py-1">
                        ${searchTags.map(tag => `
                            <button onclick="showToast('Searching ${tag}')" class="px-3.5 py-1.5 rounded-full text-xs bg-gray-800 text-gray-200 whitespace-nowrap hover:bg-gray-700">${tag}</button>
                        `).join('')}
                    </div>
